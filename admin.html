<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin console · JB Revision</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <script>try { var t = localStorage.getItem('hub-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="fonts.css?v=2">
  <link rel="stylesheet" href="hub.css?v=2">
</head>
<body>
  <div class="wrap admin">
    <header class="top">
      <div class="brand"><img src="favicon.svg" alt="" width="52" height="52"><div><h1>Admin console</h1></div></div>
      <div class="top-actions"><button type="button" class="btn-quiet quick-maint" hidden></button><a class="btn-quiet" href="/">Back to the site</a></div>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="content" class="on">Content</button>
      <button type="button" role="tab" data-tab="sessions">Signed in</button>
      <button type="button" role="tab" data-tab="accounts">Accounts</button>
      <button type="button" role="tab" data-tab="maintenance">Maintenance</button>
      <button type="button" role="tab" data-tab="usage">Usage</button>
    </nav>
    <p class="notice" role="status"></p>
    <section id="tab-content"><div class="ld" style="--ld-accent:#17A398" role="status"><svg class="ld-art" viewBox="0 -60 100 166" aria-hidden="true"><ellipse cx="50" cy="101" rx="26" ry="5" fill="#2b2620" opacity=".12"/><g class="ld-b1"><polygon points="50,56 69,67 50,78 31,67" fill="#f6f0e4"/><polygon points="31,67 50,78 50,100 31,89" fill="#e3d8c4"/><polygon points="50,78 69,67 69,89 50,100" fill="#cdbfa5"/><path d="M36 72l9 5" stroke="#fffaf0" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></g><g class="ld-b2"><path class="ld-cable" d="M50 -60V28M46 28h8l-4 6z"/><polygon points="50,34 69,45 50,56 31,45" fill="#f6f0e4"/><polygon points="31,45 50,56 50,78 31,67" fill="#e3d8c4"/><polygon points="50,56 69,45 69,67 50,78" fill="#cdbfa5"/><path d="M36 50l9 5" stroke="#fffaf0" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></g><g class="ld-b3"><path class="ld-cable" d="M50 -60V6M46 6h8l-4 6z"/><polygon points="50,12 69,23 50,34 31,23" fill="var(--ld-a-top)"/><polygon points="31,23 50,34 50,56 31,45" fill="var(--ld-a-left)"/><polygon points="50,34 69,23 69,45 50,56" fill="var(--ld-a-right)"/><path d="M36 28l9 5" stroke="#fffaf0" stroke-width="1.6" stroke-linecap="round" opacity=".6"/></g></svg><span>Loading the console…</span></div></section>
    <section id="tab-sessions" hidden></section>
    <section id="tab-accounts" hidden></section>
    <section id="tab-maintenance" hidden></section>
    <section id="tab-usage" hidden></section>
  </div>
  <dialog class="ask"><form method="dialog"><p class="ask-q"></p><input class="ask-in"><div class="ask-btns">
    <button value="cancel" type="submit" class="btn-quiet">Cancel</button><button value="ok" type="submit" class="btn-main">OK</button></div></form></dialog>
  <script src="admin.js"></script>
</body>
</html>
