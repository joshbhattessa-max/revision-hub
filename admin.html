<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jbr-hub/admin</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- no CSS at all: raw browser-default HTML -->
</head>
<body>
  <div class="admin">
    <header class="top">
      <h1>jbr-hub :: admin</h1>
      <div class="top-actions"><button type="button" class="quick-maint" hidden></button><a href="/">[exit to /]</a></div>
    </header>
    <div class="sysbar">build=<span id="sys-build">…</span> · branch=<span id="sys-branch">…</span> · edge=<span id="sys-colo">…</span> · operator=<span id="sys-op">…</span> · utc=<span id="sys-utc">…</span></div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="content" aria-selected="true" disabled>hub.json</button>
      <button type="button" role="tab" data-tab="sessions">sessions</button>
      <button type="button" role="tab" data-tab="activity">activity_log</button>
      <button type="button" role="tab" data-tab="accounts">accounts</button>
      <button type="button" role="tab" data-tab="updates">update_notes</button>
      <button type="button" role="tab" data-tab="maintenance">site_state</button>
      <button type="button" role="tab" data-tab="usage">telemetry</button>
    </nav>
    <p class="notice" role="status"></p>
    <section id="tab-content"><p class="muted">GET /api/admin/hub …</p></section>
    <section id="tab-sessions" hidden></section>
    <section id="tab-activity" hidden></section>
    <section id="tab-accounts" hidden></section>
    <section id="tab-updates" hidden></section>
    <section id="tab-maintenance" hidden><div id="takedown-box"></div><div id="maint-box"></div></section>
    <section id="tab-usage" hidden></section>
    <hr>
    <footer class="reqlog"><div>request log (this tab, newest first) · <span id="sys-bind"></span></div><pre id="reqlog"></pre></footer>
  </div>
  <dialog class="ask"><form method="dialog"><p class="ask-q"></p><input class="ask-in"><div class="ask-btns">
    <button value="cancel" type="submit">cancel</button><button value="ok" type="submit">ok</button></div></form></dialog>
  <dialog class="ask msgdlg"><form method="dialog"><p class="ask-q"></p>
    <input class="ask-in msg-title" placeholder="title (optional)" maxlength="120" size="40">
    <label class="msg-logo"><input type="checkbox"> logo=true</label>
    <div class="msg-tools" role="toolbar" aria-label="Formatting">
      <button type="button" data-cmd="bold" title="Bold"><b>B</b></button><button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
      <button type="button" data-cmd="underline" title="Underline"><u>U</u></button><button type="button" data-cmd="formatBlock" data-arg="h3" title="Heading">h3</button>
      <button type="button" data-cmd="formatBlock" data-arg="p" title="Normal text">p</button>
      <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">ul</button><button type="button" data-cmd="insertOrderedList" title="Numbered list">ol</button>
      <button type="button" data-cmd="createLink" title="Link">a</button>
      <label title="Text colour" class="msg-color">A<input type="color" value="#c0392b"></label>
      <button type="button" data-cmd="removeFormat" title="Clear formatting">clr</button>
    </div>
    <fieldset><legend>message</legend><div class="msg-ed" contenteditable="true" aria-label="Message"><p><br></p></div></fieldset>
    <div class="ask-btns"><button value="cancel" type="submit">cancel</button><button value="ok" type="submit">commit</button></div></form></dialog>
  <script src="admin.js?v=5"></script>
</body>
</html>
