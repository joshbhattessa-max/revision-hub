<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Josh B Revision</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <script>try { var t = localStorage.getItem('hub-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <main class="login">
    <form class="login-card" novalidate>
      <img class="login-logo" src="favicon.svg" alt="" width="72" height="72">
      <h1>Josh B Revision</h1>
      <p class="login-sub">Sign in</p>
      <label>Username <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="login-error" role="alert"></p>
      <button type="submit">Sign in</button>
      <p class="login-switch"><span>New here?</span> <a href="#signup">Create an account</a></p>
      <p class="login-note">You stay signed in for 6 hours.</p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
